[package]
name = "eiffel-build"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
anyhow = "1"
aws-nitro-enclaves-image-format = "0.8"
clap = { version = "4", features = ["derive"] }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.154"
serde_yaml = "0.9"
sha2 = "0.10"
