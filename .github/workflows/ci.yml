name: CI

on:
  pull_request:
  push:
    branches: [master]

jobs:
  rust:
    # Pinned rather than ubuntu-latest: GitHub is rolling that label from 24.04 to
    # 26.04 between 2026-10-19 and 2026-11-19, so it is unpredictable right now.
    # Revisit once the rollout has finished.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
