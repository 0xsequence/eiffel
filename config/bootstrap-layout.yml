files:
  - path: dev
    directory: true
    mode: "0755"
  - path: init
    source: /blobs/init
    mode: "0755"

  - path: rootfs/dev
    directory: true
    mode: "0755"
  - path: rootfs/run
    directory: true
    mode: "0755"
  - path: rootfs/sys
    directory: true
    mode: "0755"
  - path: rootfs/proc
    directory: true
    mode: "0755"
  - path: rootfs/tmp
    directory: true
    mode: "0755"

  - path: rootfs/etc/ssl/certs/ca-certificates.crt
    source: /blobs/ca-certificates.crt
    mode: "0644"

